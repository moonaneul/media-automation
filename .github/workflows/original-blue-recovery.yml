name: Original Blue Recovery Tests
on:
  push:
    branches:
      - feature/working-original-blue-stack-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Original UI and API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run complete original-stack regression
        run: python -m pytest -q tests/test_original_blue_stack.py tests/test_original_blue_bulletin_parser.py
