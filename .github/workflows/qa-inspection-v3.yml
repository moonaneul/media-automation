name: QA inspection v3
on:
  push:
    branches: [feature/qa-audit-v3-20261009]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_qa_inspection.py
      - run: python -m pytest -q
