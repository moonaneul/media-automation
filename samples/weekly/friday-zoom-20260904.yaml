  status: VALUE
  topics:
    - |-
      일상을 이어갈 수 있는 은혜에 감사하며
      - 일상이라는 하나님의 특별한 은혜에 감사하며 살게 하소서.
    - |-
      하나님을 의지하고 믿음으로 걸어가는 매일의 삶이 되도록
      - “믿음이 없이는 하나님을 기쁘시게 하지 못하나니”

