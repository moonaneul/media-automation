community_prayer:
  status: VALUE
  topics:
    - |-
      교회 안에 있는 다음 세대를 위하여
      - 유초등부 교사 : 이광민(부장), 신무순, 김진아, 이하선, 문하늘
      - 젭스 교사 : 문호성, 박진경, 이은혜
    - |-
      하늘빛기쁨교회를 위하여
      - 영혼 구원하여 제자 삼는 교회로 쓰임 받을 수 있도록
    - |-
      국가와 민족을 위하여
      - 국가의 체계가 흔들리지 않고 대립에서 화합으로 나아갈 수 있도록 도와주소서.

personal_prayer:
  status: VALUE
  text: |-
    더 깊은 주님과의 친밀함 가운데 나아가시기 바랍니다.
    지금은 개인 기도 시간입니다.