community_prayer:
  status: VALUE
  topics:
    - |-
      교회 안에 있는 다음 세대를 위하여
      - 학생부 교사 : 임현희(부장), 조서희, 문호성, 이하은, 황예찬, 장호준
    - |-
      ‘생명의 삶’ 개강(9/13)
      - 삶 공부를 통하여 삶의 자리에 변화의 바람이 불도록 함께해 주소서.
    - |-
      국가를 위하여
      - 극한 대립에서 화합으로 나아갈 수 있도록 위정자들을 도와주소서.

personal_prayer:
  status: VALUE
  text: |-
    더 깊은 주님과의 친밀함 가운데 나아가시기 바랍니다.
    지금은 개인 기도 시간입니다.