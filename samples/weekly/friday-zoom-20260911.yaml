  status: VALUE
  topics:
    - |-
      실패의 자리에서 승리로
      - 과거의 아픔과 실패가 하나님의 은혜로 새로운 믿음의 출발점이 되도록
    - |-
      원망 대신 감사와 기도
      - 광야 같은 삶 속에서도 불평이 아닌 감사와 기도로 반응할 수 있도록

