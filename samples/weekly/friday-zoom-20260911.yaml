first_prayer:
  status: VALUE
  topics:
    - |-
      이 자리까지 인도해 주신 은혜에 감사하며
      - 그러나 내가 나 된 것은 하나님의 은혜로 된 것이니
        (고전 15:10)
    - |-
      하나님의 말씀이 내 삶을 이끌어 가는 은혜를 누리도록
      - 주의 말씀은 내 발에 등이요 내 길에 빛이니이다
        (시 119:105)

