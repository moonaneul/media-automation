word_prayer:
  status: VALUE
  topics:
  - '거룩한 성전으로 살아가도록

    우리의 마음과 몸을 깨끗하게 지켜 성령께서 기뻐하시는 삶을 살게 하소서.'
  - '성령의 능력으로 변화되는 삶을 살도록

    우리 안에 거하시는 성령의 도우심으로 거룩하게 살아갈 힘을 주소서.'
