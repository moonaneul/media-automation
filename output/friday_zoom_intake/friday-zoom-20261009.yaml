first_prayer:
  status: VALUE
  topics:
  - '염려가 나를 찾아올 때마다 말씀과 기도로 승리할 수 있도록

    [6] 아무것도 염려하지 말고 다만 모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라 [7] 그리하면 모든 지각에 뛰어난
    하나님의 평강이 그리스도 예수 안에서 너희 마음과 생각을 지키시리라 (빌 4:6~7)'
  - '말씀을 알아갈수록 주님을 더욱 사랑하는 그리스도인으로 살 수 있도록

    내 구주 예수를 더욱 사랑 ~'
