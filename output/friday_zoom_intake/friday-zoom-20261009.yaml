community_prayer:
  status: VALUE
  topics:
  - '10월에도 주님과 동행하며 승리하는 삶을 살 수 있도록

    에벤에셀의 하나님을 찬양하며 최선의 길로 인도하실 주님을 바라보게 하소서.'
  - '국가와 민족을 위하여

    정치, 사회, 경제, 북한의 위협'
  - '하늘빛기쁨교회가 신약교회, 사도행전적 교회의 본질을 회복하도록

    하늘빛기쁨교회가 빛과 소금의 역할을 감당하게 하소서'
