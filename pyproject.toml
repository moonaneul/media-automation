[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "media-automation"
version = "0.1.0"
description = "Church worship media automation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
    "PyYAML>=6,<7",
    "python-pptx>=1.0,<2",
    "Pillow>=10,<13",
    "reportlab>=4,<5",
    "olefile>=0.47,<1",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"media_automation.web" = ["static/*.html", "static/*.css", "static/*.js"]
