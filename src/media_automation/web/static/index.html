<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교회 미디어 제작실</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><span>하늘빛기쁨성서침례교회</span><h1>미디어 제작실</h1><p>이번 주 자료를 모으고, 제작 결과를 확인하세요.</p></header>
<main><section><h2>새 제작</h2><form id="create"><label>종류<select id="service"><option value="bulletin">주일 주보</option><option value="sunday">주일예배</option><option value="wednesday">수요예배</option><option value="friday">금요기도회 (Zoom)</option></select></label><label>날짜<input id="date" type="date" required></label><button>작업 만들기</button></form><p class="hint">이전 주 내용은 가져오지 않습니다. 같은 주의 최신 자료를 등록해주세요.</p></section>
<section><h2>제작 목록</h2><div id="jobs"></div></section><section id="detail" hidden><h2 id="title"></h2><p id="state"></p><h3>자료 등록</h3><p>현재 단계에서는 기존 제작 폴더와 같은 상대 경로로 등록합니다. 입력 양식 자동 연결은 다음 단계입니다.</p><form id="upload"><label>저장 위치<input id="path" placeholder="input/bulletin/20260927/transfer.hwp" required></label><label>파일<input id="file" type="file" required></label><button>등록</button></form><ul id="inputs"></ul><label>원본 PPTX 위치 (수요·주일)<input id="source" placeholder="input/sunday/20260927/source_rehearsal.pptx"></label><button id="run" type="button">제작 실행</button><h3>결과</h3><div id="artifacts"></div><p class="hint">생성 완료는 검수 완료가 아닙니다. 화면, 주보 인쇄면, 영상·음원 재생을 별도로 확인해주세요.</p></section><p id="message" role="status" aria-live="polite"></p></main></body></html>
