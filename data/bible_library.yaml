translation: 개역개정
passages:
  창 29:15-30:
    reference: 창 29:15~30
    verses:
      15: 라반이 야곱에게 이르되 네가 비록 내 생질이나 어찌 그저 내 일을 하겠느냐 네 품삯을 어떻게 할지 내게 말하라
      16: 라반에게 두 딸이 있으니 언니의 이름은 레아요 아우의 이름은 라헬이라
      17: 레아는 시력이 약하고 라헬은 곱고 아리따우니
      18: 야곱이 라헬을 더 사랑하므로 대답하되 내가 외삼촌의 작은 딸 라헬을 위하여 외삼촌에게 칠 년을 섬기리이다
      19: 라반이 이르되 그를 네게 주는 것이 타인에게 주는 것보다 나으니 나와 함께 있으라
      20: 야곱이 라헬을 위하여 칠 년 동안 라반을 섬겼으나 그를 사랑하는 까닭에 칠 년을 며칠 같이 여겼더라
      21: 야곱이 라반에게 이르되 내 기한이 찼으니 내 아내를 내게 주소서 내가 그에게 들어가겠나이다
      22: 라반이 그 곳 사람을 다 모아 잔치하고
      23: 저녁에 그의 딸 레아를 야곱에게로 데려가매 야곱이 그에게로 들어가니라
      24: 라반이 또 그의 여종 실바를 그의 딸 레아에게 시녀로 주었더라
      25: 야곱이 아침에 보니 레아라 라반에게 이르되 외삼촌이 어찌하여 내게 이같이 행하셨나이까 내가 라헬을 위하여 외삼촌을 섬기지 아니하였나이까
        외삼촌이 나를 속이심은 어찌됨이니이까
      26: 라반이 이르되 언니보다 아우를 먼저 주는 것은 우리 지방에서 하지 아니하는 바이라
      27: 이를 위하여 칠 일을 채우라 우리가 그도 네게 주리니 네가 또 나를 칠 년 동안 섬길지니라
      28: 야곱이 그대로 하여 그 칠 일을 채우매 라반이 딸 라헬도 그에게 아내로 주고
      29: 라반이 또 그의 여종 빌하를 그의 딸 라헬에게 주어 시녀가 되게 하매
      30: 야곱이 또한 라헬에게로 들어갔고 그가 레아보다 라헬을 더 사랑하여 다시 칠 년 동안 라반을 섬겼더라
    _source: samples\weekly\friday-zoom-20260904-bible.yaml
  민 21:1-9:
    reference: 민 21:1~9
    verses:
      1: 네겝에 거주하는 가나안 사람 곧 아랏의 왕이 이스라엘이 아다림 길로 온다 함을 듣고 이스라엘을 쳐서 그 중 몇 사람을 사로잡은지라
      2: 이스라엘이 여호와께 서원하여 이르되 주께서 만일 이 백성을 내 손에 넘기시면 내가 그들의 성읍을 다 멸하리이다
      3: 여호와께서 이스라엘의 목소리를 들으시고 가나안 사람을 그들의 손에 넘기시매 그들과 그들의 성읍을 다 멸하니라 그러므로 그 곳 이름을
        호르마라 하였더라
      4: 백성이 호르 산에서 출발하여 홍해 길을 따라 에돔 땅을 우회하려 하였다가 길로 말미암아 백성의 마음이 상하니라
      5: 백성이 하나님과 모세를 향하여 원망하되 어찌하여 우리를 애굽에서 인도해 내어 이 광야에서 죽게 하는가 이 곳에는 먹을 것도 없고 물도
        없도다 우리 마음이 이 하찮은 음식을 싫어하노라 하매
      6: 여호와께서 불뱀들을 백성 중에 보내어 백성을 물게 하시므로 이스라엘 백성 중에 죽은 자가 많은지라
      7: 백성이 모세에게 이르러 말하되 우리가 여호와와 당신을 향하여 원망함으로 범죄하였사오니 여호와께 기도하여 이 뱀들을 우리에게서 떠나게
        하소서 모세가 백성을 위하여 기도하매
      8: 여호와께서 모세에게 이르시되 불뱀을 만들어 장대 위에 매달아라 물린 자마다 그것을 보면 살리라
      9: 모세가 놋뱀을 만들어 장대 위에 다니 뱀에게 물린 자가 놋뱀을 쳐다본즉 모두 살더라
    _source: samples\weekly\friday-zoom-20260911-bible.yaml
  요 3:14-15:
    reference: 요 3:14~15
    verses:
      14: 모세가 광야에서 뱀을 든 것 같이 인자도 들려야 하리니
      15: 이는 그를 믿는 자마다 영생을 얻게 하려 하심이니라
    _source: samples\weekly\friday-zoom-20260911-bible.yaml
  왕상 9:1-10:
    reference: 왕상 9:1~10
    verses:
      1: 솔로몬이 여호와의 성전과 왕궁 건축하기를 마치며 자기가 이루기를 원하던 모든 것을 마친 때에
      2: 여호와께서 전에 기브온에서 나타나심 같이 다시 솔로몬에게 나타나사
      3: 여호와께서 그에게 이르시되 네 기도와 네가 내 앞에서 간구한 바를 내가 들었은즉 나는 네가 건축한 이 성전을 거룩하게 구별하여 내
        이름을 영원히 그 곳에 두며 내 눈길과 내 마음이 항상 거기에 있으리니
      4: 네가 만일 네 아버지 다윗이 행함 같이 마음을 온전히 하고 바르게 하여 내 앞에서 행하며 내가 네게 명령한 대로 온갖 일에 순종하여
        내 법도와 율례를 지키면
      5: 내가 네 아버지 다윗에게 말하기를 이스라엘의 왕위에 오를 사람이 네게서 끊어지지 아니하리라 한 대로 네 이스라엘의 왕위를 영원히 견고하게
        하려니와
      6: 만일 너희나 너희의 자손이 아주 돌아서서 나를 따르지 아니하며 내가 너희 앞에 둔 나의 계명과 법도를 지키지 아니하고 가서 다른 신을
        섬겨 그것을 경배하면
      7: 내가 이스라엘을 내가 그들에게 준 땅에서 끊어 버릴 것이요 내 이름을 위하여 내가 거룩하게 구별한 이 성전이라도 내 앞에서 던져버리리니
        이스라엘은 모든 민족 가운데에서 속담거리와 이야기거리가 될 것이며
      8: 이 성전이 높을지라도 지나가는 자마다 놀라며 비웃어 이르되 여호와께서 무슨 까닭으로 이 땅과 이 성전에 이같이 행하셨는고 하면
      9: 대답하기를 그들이 그들의 조상들을 애굽 땅에서 인도하여 내신 그들의 하나님 여호와를 버리고 다른 신을 따라가서 그를 경배하여 섬기므로
        여호와께서 이 모든 재앙을 그들에게 내리심이라 하리라 하셨더라
      10: 솔로몬이 두 집 곧 여호와의 성전과 왕궁을 이십 년 만에 건축하기를 마치고
    _source: samples\weekly\friday-zoom-20260918-bible.yaml
  히 11:1~3:
    reference: 히 11:1~3
    verses:
      1: 믿음은 바라는 것들의 실상이요 보이지 않는 것들의 증거니
      2: 선진들이 이로써 증거를 얻었느니라
      3: 믿음으로 모든 세계가 하나님의 말씀으로 지어진 줄을 우리가 아나니 보이는 것은 나타난 것으로 말미암아 된 것이 아니니라
    _source: data\private\bible_sources\sunday-20260927.yaml
  삼상 17:41~49:
    reference: 삼상 17:41~49
    verses:
      41: 블레셋 사람이 방패 든 사람을 앞세우고 다윗에게로 점점 가까이 나아가니라
      42: 그 블레셋 사람이 둘러보다가 다윗을 보고 업신여기니 이는 그가 젊고 붉고 용모가 아름다움이라
      43: 블레셋 사람이 다윗에게 이르되 네가 나를 개로 여기고 막대기를 가지고 내게 나아왔느냐 하고 그의 신들의 이름으로 다윗을 저주하고
      44: 그 블레셋 사람이 또 다윗에게 이르되 내게로 오라 내가 네 살을 공중의 새들과 들짐승들에게 주리라 하는지라
      45: 다윗이 블레셋 사람에게 이르되 너는 칼과 창과 단창으로 내게 나아 오거니와 나는 만군의 여호와의 이름 곧 네가 모욕하는 이스라엘
        군대의 하나님의 이름으로 네게 나아가노라
      46: 오늘 여호와께서 너를 내 손에 넘기시리니 내가 너를 쳐서 네 목을 베고 블레셋 군대의 시체를 오늘 공중의 새와 땅의 들짐승에게 주어
        온 땅으로 이스라엘에 하나님이 계신 줄 알게 하겠고
      47: 또 여호와의 구원하심이 칼과 창에 있지 아니함을 이 무리에게 알게 하리라 전쟁은 여호와께 속한 것인즉 그가 너희를 우리 손에 넘기시리라
      48: 블레셋 사람이 일어나 다윗에게로 마주 가까이 올 때에 다윗이 블레셋 사람을 향하여 빨리 달리며
      49: 손을 주머니에 넣어 돌을 가지고 물매로 던져 블레셋 사람의 이마를 치매 돌이 그의 이마에 박히니 땅에 엎드러지니라
    _source: data\private\bible_sources\wednesday-20260930.yaml
  삼상 18:6~11:
    reference: 삼상 18:6~11
    verses:
      6: 무리가 돌아올 때 곧 다윗이 블레셋 사람을 죽이고 돌아올 때에 여인들이 이스라엘 모든 성읍에서 나와서 노래하며 춤추며 소고와 경쇠를
        가지고 왕 사울을 환영하는데
      7: 여인들이 뛰놀며 노래하여 이르되 사울이 죽인 자는 천천이요 다윗은 만만이로다 한지라
      8: 사울이 그 말에 불쾌하여 심히 노하여 이르되 다윗에게는 만만을 돌리고 내게는 천천만 돌리니 그가 더 얻을 것이 나라 말고 무엇이냐
        하고
      9: 그 날 후로 사울이 다윗을 주목하였더라
      10: 그 이튿날 하나님께서 부리시는 악령이 사울에게 힘 있게 내리매 그가 집 안에서 정신 없이 떠들어대므로 다윗이 평일과 같이 손으로
        수금을 타는데 그 때에 사울의 손에 창이 있는지라
      11: 그가 스스로 이르기를 내가 다윗을 벽에 박으리라 하고 사울이 그 창을 던졌으나 다윗이 그의 앞에서 두 번 피하였더라
    _source: data\private\bible_sources\wednesday-20261007.yaml
